# Power Menu Configuration
# This file configures the power button menu appearance and options
#
# NOTE: DO NOT keep comments on the same line, this is not
#       a properly parsed file and fuzzel really sucks on it
#

# Menu Items
# Format: label=command
# Empty command means the menu just closes (useful for Cancel)
# Labels are shown exactly as written here, case included
#
# [items.nested] and [items.standalone] are matched against --mode and
#       REPLACE [items] completely, they don't merge with it.
#       [items] section is used only when no section matches the current mode
[items]
Exit=labwc -e
Cancel=

# Nested mode: running as a window inside another session
[items.nested]
Close=labwc -e
Cancel=

# Standalone mode: running on bare metal, full session control
[items.standalone]
Logout=labwc -e
Shutdown=systemctl poweroff
Reboot=systemctl reboot
Cancel=

# Fuzzel Appearance Settings
# All settings are optional - remove/comment to use fuzzel defaults
[colors]
# RRGGBBAA format (hex + alpha channel)
# window background color
background=1a1a1aee
# window border color
border=12AE14FF
# (search) text on deselected
match=0102FFFF
# (search) text on selected
selection-match=0102FFFF
# Selected item, background
selection=12AE14FF
# Selected item, foreground
selection-text=000000ff
# Deselected item, foreground
text=12AE14FF


[main]
font=Sans:size=18
# Horizontal padding (spaces on each side of text)
horizontal-pad=50
# Vertical padding (spaces above/below text)
vertical-pad=30
# Inner padding between box border and text
inner-pad=5

[border]
width=3
radius=10

# Where the menu opens on screen, it's Independent from other menus
[position]
# Screen edge the menu is anchored to:
#       top-left, top, top-right, left, center, right,
#       bottom-left, bottom, bottom-right
anchor=center
# Distance from that edge, in pixels
x-margin=0
y-margin=0

[dmenu]
# Exit immediately if no match
exit-immediately-if-empty=no
