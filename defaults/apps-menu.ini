# Apps Menu Configuration
# This file configures the Apps button menu appearance and placement
#
# NOTE: DO NOT keep comments on the same line, this is not
#       a properly parsed file and fuzzel really sucks on it
#
# The Apps menu is fuzzel in launcher mode, it lists your installed
# .desktop files. There is no item list to configure here, the button
# label lives in config.yaml under the menu widget
#
# All settings are optional - remove/comment to use fuzzel defaults

# Fuzzel Appearance Settings
[colors]
# RRGGBBAA format (hex + alpha channel)
# window background color
background=1A1A1AD6
# window border color
border=474747FF
# (search) text on deselected
match=0102FFFF
# (search) text on selected
selection-match=0102FFFF
# Selected item, background
selection=F6F5F4FF
# Selected item, foreground
selection-text=000000ff
# Deselected item, foreground
text=D6D5D4FF


[main]
font=Sans:size=16
# Horizontal padding (spaces on each side of text)
horizontal-pad=10
# Vertical padding (spaces above/below text)
vertical-pad=10
# Inner padding between box border and text
inner-pad=5
# Keyboard grab: on-demand, exclusive or none
keyboard-focus=on-demand

[border]
width=3
radius=10

# Where the menu opens on screen
[position]
# Screen edge the menu is anchored to
# top-left, top, top-right, left, center, right,
# bottom-left, bottom, bottom-right
anchor=top-left
# Distance from that edge, in pixels
x-margin=1
y-margin=3
